<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizza Fire — Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="delivery.css">
</head>
<body>
<div id="login" class="screen"><div class="card login-card"><div class="logo">🍕 Pizza <b>Fire</b></div><span class="eyebrow">DELIVERY PARTNER</span><h1>Delivery Dashboard</h1><p>Sign in to see your assigned deliveries.</p><form id="loginForm"><label>Email<input id="email" type="email" value="delivery@pizzafire.com" required></label><label>Password<input id="password" type="password" value="Delivery@12345" required></label><button class="primary" type="submit">Sign In →</button><div id="loginError" class="error"></div></form></div></div>
<div id="app" class="hidden"><header><div><div class="logo">🍕 Pizza <b>Fire</b></div><span class="eyebrow">DELIVERY DASHBOARD</span></div><div class="head-actions"><strong id="staffName">Delivery</strong><button id="refresh" class="ghost">↻ Refresh</button><button id="logout" class="ghost">Logout</button></div></header>
<main><div class="welcome"><div><span class="eyebrow">TODAY'S DELIVERIES</span><h1>Assigned Orders</h1><p>Pick up the order, reach the customer and mark it delivered.</p></div><div class="count" id="count">0</div></div><div id="orders" class="orders"></div></main></div>
<script src="delivery.js"></script>
</body></html>
