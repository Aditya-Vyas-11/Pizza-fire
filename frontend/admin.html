<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pizza Fire — Owner Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="admin.css">
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginScreen" class="login-screen">

    <div class="login-card">

        <div class="login-logo">
            🍕 Pizza <span>Fire</span>
        </div>

        <p class="login-label">
            PRIVATE OWNER CONSOLE
        </p>

        <h1>Welcome back</h1>

        <p class="login-description">
            Sign in to manage orders, menu, offers and your store.
        </p>

        <form id="loginForm">

            <div class="input-group">
                <label>Email</label>

                <input
                    id="email"
                    type="email"
                    placeholder="Owner email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>

                <input
                    id="password"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button class="btn primary full" type="submit">
                Sign in securely →
            </button>

            <div id="loginError" class="error"></div>

        </form>

    </div>

</div>


<!-- =====================================================
     APPLICATION
===================================================== -->

<div id="application" class="application hidden">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-main">
                🍕 Pizza <span>Fire</span>
            </div>

            <small>OWNER CONSOLE</small>

        </div>


        <div class="owner-card">

            <div class="owner-avatar">
                PF
            </div>

            <div>
                <strong>Pizza Fire</strong>
                <span>Administrator</span>
            </div>

        </div>


        <nav class="navigation">

            <button
                class="nav-item active"
                data-page="dashboard"
            >
                <span>⌂</span>
                Dashboard
            </button>

            <button
                class="nav-item"
                data-page="orders"
            >
                <span>▣</span>
                Orders
                <b id="newOrderBadge">0</b>
            </button>

            <button
                class="nav-item"
                data-page="menu"
            >
                <span>🍕</span>
                Menu
            </button>

            <button
                class="nav-item"
                data-page="offers"
            >
                <span>🎁</span>
                Offers
            </button>

            <button
                class="nav-item"
                data-page="customers"
            >
                <span>♙</span>
                Customers
            </button>

            <button
                class="nav-item"
                data-page="analytics"
            >
                <span>↗</span>
                Analytics
            </button>

            <button
                class="nav-item"
                data-page="settings"
            >
                <span>⚙</span>
                Settings
            </button>

        </nav>


        <div class="sidebar-bottom">

            <div class="store-status">
                <i></i>

                <div>
                    <span>Store status</span>
                    <strong>OPEN</strong>
                </div>
            </div>

            <button id="logoutButton" class="logout-button">
                ↪ Logout
            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <div>

                <div class="breadcrumb">
                    PIZZA FIRE
                    /
                    <span id="breadcrumbPage">
                        DASHBOARD
                    </span>
                </div>

                <h2 id="pageTitle">
                    Dashboard
                </h2>

            </div>


            <div class="topbar-actions">

                <button
                    id="refreshButton"
                    class="icon-button"
                    title="Refresh"
                >
                    ↻
                </button>

                <a
                    class="view-store"
                    href="http://127.0.0.1:5500"
                    target="_blank"
                >
                    ↗ View Store
                </a>

            </div>

        </header>


        <!-- PAGE CONTENT -->

        <section id="pageContent"></section>

    </main>

</div>


<!-- =====================================================
     ITEM DRAWER
===================================================== -->

<div id="itemDrawerOverlay" class="drawer-overlay">

    <aside class="drawer">

        <div class="drawer-header">

            <div>

                <small>MENU MANAGEMENT</small>

                <h2 id="drawerTitle">
                    Add item
                </h2>

            </div>

            <button
                class="close-button"
                id="closeItemDrawer"
            >
                ×
            </button>

        </div>


        <form id="itemForm">

            <input
                id="itemId"
                type="hidden"
            >


            <div class="input-group">

                <label>Item name *</label>

                <input
                    id="itemName"
                    type="text"
                    placeholder="e.g. Paneer Tikka Pizza"
                    required
                >

            </div>


            <div class="two-column">

                <div class="input-group">

                    <label>Category *</label>

                    <select id="itemCategory">

                        <option>Pizza</option>
                        <option>Mini Pizza</option>
                        <option>Combos</option>
                        <option>Beverages</option>
                        <option>Side Items</option>
                        <option>Burger</option>
                        <option>Pasta</option>
                        <option>Maggi</option>
                        <option>Rolls</option>
                        <option>Sandwich</option>
                        <option>French Fries</option>

                    </select>

                </div>


                <div class="input-group">

                    <label>Price *</label>

                    <input
                        id="itemPrice"
                        type="number"
                        min="0"
                        placeholder="199"
                        required
                    >

                </div>

            </div>


            <div class="two-column">

                <div class="input-group">

                    <label>Icon / Emoji</label>

                    <input
                        id="itemEmoji"
                        value="🍕"
                    >

                </div>


                <div class="input-group">

                    <label>Availability</label>

                    <select id="itemAvailability">

                        <option value="1">
                            Available
                        </option>

                        <option value="0">
                            Hidden
                        </option>

                    </select>

                </div>

            </div>


            <div class="input-group">

                <label>Description</label>

                <textarea
                    id="itemDescription"
                    placeholder="Short description shown to customers..."
                ></textarea>

            </div>


            <label class="toggle-row">

                <input
                    id="itemCustomization"
                    type="checkbox"
                >

                <span>
                    Enable pizza customization
                </span>

            </label>


            <label class="toggle-row">

                <input
                    id="itemBestseller"
                    type="checkbox"
                >

                <span>
                    Mark as bestseller
                </span>

            </label>


            <div class="drawer-footer">

                <button
                    type="button"
                    class="btn secondary"
                    id="cancelItem"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn primary"
                >
                    Save item
                </button>

            </div>

        </form>

    </aside>

</div>


<!-- =====================================================
     ORDER DRAWER
===================================================== -->

<div id="orderDrawerOverlay" class="drawer-overlay">

    <aside class="drawer order-drawer">

        <div class="drawer-header">

            <div>

                <small>ORDER DETAILS</small>

                <h2 id="orderDrawerTitle">
                    Order
                </h2>

            </div>

            <button
                class="close-button"
                id="closeOrderDrawer"
            >
                ×
            </button>

        </div>

        <div id="orderDetails"></div>

    </aside>

</div>


<!-- =====================================================
     TOAST
===================================================== -->

<div id="toast" class="toast"></div>


<script src="admin.js"></script>

</body>
</html>
